#
# SonarQube Cloud project configuration for cla. Scanner reference:
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-parameters/
#
# Everything the scanner can read from a file is set here, so the project
# can be rebuilt from the repository alone. What only the web UI holds (the
# organization's settings, Automatic Analysis off, the repository binding) is
# listed in kleidos-dev/.github, docs/sonarcloud.md.

# --- Project identification ---
sonar.organization=kleidos-dev
sonar.projectKey=kleidos-dev_cla
sonar.projectName=cla
# The GitHub repository's description, shown on the project page.
sonar.projectDescription=The Kleidos Contributor License Agreement, its signature registry and the bot that collects signatures

# --- Links shown on the project page (none is set in the UI) ---
sonar.links.homepage=https://cla.kleidos.dev
sonar.links.scm=https://github.com/kleidos-dev/cla
sonar.links.issue=https://github.com/kleidos-dev/cla/issues
sonar.links.ci=https://github.com/kleidos-dev/cla/actions

# --- Layout ---
# The code is the recorder and verifier (registry/cla.py), the Worker and the
# owner's setup scripts. The agreements, the privacy notices, the register's
# data and the copies under .github/ (the quality kit and the commit check,
# analyzed where they are kept) are under no root named here.
sonar.sources=registry/cla.py,worker/src,worker/scripts,scripts/create-github-app.ts,scripts/create-signin-app.ts
sonar.tests=registry/tests,worker/test,scripts/test,tests
sonar.sourceEncoding=UTF-8
# The scope is the one named above: the scanner's automatic configuration
# (a guess at sources, tests and exclusions) stays off, whatever a re-import
# sets in the UI.
sonar.scanner.autoconfig.enabled=false

# --- Language ---
# below-latest: the newest Python version SonarQube Cloud lists as supported;
# the CI runs the version in .python-version (3.15), so raise this when the
# docs list it.
sonar.python.version=3.14
sonar.typescript.tsconfigPaths=worker/tsconfig.json,scripts/tsconfig.json

# --- Coverage ---
# The reports the CI's three test jobs write and hand to the SonarCloud job
# in the "coverage" artifact: the register's, the Worker's, and the setup
# scripts' and agreement gate's (Node measures the scripts in the child
# processes their tests start as well).
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=lcov.info,scripts-lcov.info

# No sonar.issue.ignore.*, no coverage.exclusions and no cpd.exclusions to move
# a number: an issue is fixed with a real change or left open, and coverage is
# raised with tests (the Kleidos rule since 2026-07-12).
