#
# Weekly: is this repository's copy of the Kleidos quality kit behind
# kleidos-dev/.github main? When it is, the reusable workflow dry-runs the
# new kit on a copy of this tree, writes what a sync would change to the job
# summary and fails: the red run is the notice. It writes nowhere, never
# pushes and never runs pull-request code.
# Written once by the kit's sync.py; the sync keeps the reference below at the
# recorded kit commit (docs/quality.md in kleidos-dev/.github).
name: Quality kit drift

on:
  schedule:
    # Monday 06:00 Europe/Madrid in winter, with the Dependabot runs.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  drift:
    name: "🔭 Quality kit drift"
    uses: kleidos-dev/.github/.github/workflows/reusable-quality-drift.yml@f3cb9fc380dea5a33c4539f013c0b1dab8ca6b1d # quality-v2.3.0
    permissions:
      contents: read
