#
# The mutants, every Monday and by hand: what a test noticed, where ci.yml
# measures what a test ran. Each job plants its share of them in the Worker's
# core, inside the Workers runtime, and holds the survivors to
# tests/floors/worker-core.toml and tests/exclusions/worker-core.toml, so a
# survivor nobody listed, and a listed one that is now killed, are red.
# Nothing is written anywhere: a red job and its log are the report.
name: Mutation

on:
  schedule:
    # Monday 05:00 Europe/Madrid in winter.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutants:
    name: "🧬 Mutants of the Worker's core (${{ matrix.shard }})"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard: assess, authors, bot
            files: src/assess.ts,src/authors.ts,src/bot.ts
          - shard: registry, session, log
            files: src/registry.ts,src/session.ts,src/log.ts
          - shard: github, keys, util, env
            files: src/github.ts,src/keys.ts,src/util.ts,src/env.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - working-directory: worker
        run: npm ci
      - name: Every mutant, five seconds over its own time at most
        working-directory: worker
        env:
          FILES: ${{ matrix.files }}
        run: npm run test:mutation -- --mutate "$FILES"
      - name: No survivor that is not listed
        working-directory: worker
        run: python3 ../tests/tools/ratchet.py check worker-core --mutants coverage/mutation.json

  forced:
    name: "🧬 Forced conditions of the Worker's core"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - working-directory: worker
        run: npm ci
      - name: Every condition held true, then false
        working-directory: worker
        run: npm run test:forced -- src/assess.ts src/authors.ts src/bot.ts src/env.ts src/github.ts src/keys.ts src/log.ts src/registry.ts src/session.ts src/util.ts
      - name: No survivor that is not listed
        working-directory: worker
        run: python3 ../tests/tools/ratchet.py check worker-core --forced coverage/force.json
