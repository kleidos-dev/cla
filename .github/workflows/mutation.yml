#
# The mutants, every Monday and by hand: what a test noticed, where ci.yml
# measures what a test ran. Each job plants its share of them in one area of
# the Worker (worker-core, worker-edge), inside the Workers runtime, and holds
# the survivors to that area's tests/floors/<area>.toml and
# tests/exclusions/<area>.toml, so a survivor nobody listed, a listed one that
# is now killed, and a file with fewer mutants than it has are red. The shares
# are made from the area's own list of files: none can be left out. Nothing is
# written anywhere: a red job and its log are the report.
name: Mutation

on:
  schedule:
    # Monday 05:00 Europe/Madrid in winter.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutants:
    name: "🧬 Mutants of ${{ matrix.area }} (${{ matrix.share }})"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { area: worker-core, share: 1/3 }
          - { area: worker-core, share: 2/3 }
          - { area: worker-core, share: 3/3 }
          - { area: worker-edge, share: 1/4 }
          - { area: worker-edge, share: 2/4 }
          - { area: worker-edge, share: 3/4 }
          - { area: worker-edge, share: 4/4 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - working-directory: worker
        run: npm ci
      - name: Every mutant, five seconds over its own time at most
        working-directory: worker
        env:
          AREA: ${{ matrix.area }}
          SHARE: ${{ matrix.share }}
        run: |
          files="$(python3 ../tests/tools/ratchet.py files "$AREA" --share "$SHARE")"
          npm run test:mutation -- --mutate "$files"
      - name: No survivor that is not listed
        working-directory: worker
        env:
          AREA: ${{ matrix.area }}
          SHARE: ${{ matrix.share }}
        run: |
          files="$(python3 ../tests/tools/ratchet.py files "$AREA" --share "$SHARE")"
          python3 ../tests/tools/ratchet.py check "$AREA" --mutants coverage/mutation.json --only "$files"

  forced:
    name: "🧬 Forced conditions of ${{ matrix.area }} (${{ matrix.share }})"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { area: worker-core, share: 1/1 }
          - { area: worker-edge, share: 1/2 }
          - { area: worker-edge, share: 2/2 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - working-directory: worker
        run: npm ci
      - name: Every condition held true, then false
        working-directory: worker
        env:
          AREA: ${{ matrix.area }}
          SHARE: ${{ matrix.share }}
        run: |
          files="$(python3 ../tests/tools/ratchet.py files "$AREA" --share "$SHARE")"
          npm run test:forced -- "$files"
      - name: No survivor that is not listed
        working-directory: worker
        env:
          AREA: ${{ matrix.area }}
          SHARE: ${{ matrix.share }}
        run: |
          files="$(python3 ../tests/tools/ratchet.py files "$AREA" --share "$SHARE")"
          python3 ../tests/tools/ratchet.py check "$AREA" --forced coverage/force.json --only "$files"
