#
# The repository's gate on every push and pull request, cheapest first (the
# project's CI convention: a failure skips what depends on it):
#
#   🧹 Lint ───────┬─ 🔎 Types (mypy)
#   ⚖️ Licensing ──┼─ 🔎 ESLint and tsc
#                  ├─ 🐍 Register tests ──────────────┬─ 📦 Coverage reports ── 📊 SonarCloud
#                  ├─ 🧪 Worker tests ────────────────┤
#                  ├─ 🔑 Setup scripts and workflows ─┘
#                  ├─ 🧬 Mutants of the changed scripts (pull requests)
#                  ├─ 🌐 Pages
#                  ├─ 🛡️ Dependency vulnerabilities (OSV)
#                  └─ 🔐 Secrets and MAC scan (gitleaks)
#
# Every check is a job of the Kleidos quality kit (kleidos-dev/.github,
# docs/quality.md), called at the kit commit .github/quality/SOURCE.json
# records; the kit's sync.py keeps those references. The lint job runs
# every pre-commit hook, the agreement digests among them. The Worker's
# vitest run, the setup scripts', workflows' and pages' tests are this
# repository's own.
#
# No job here holds a secret or writes to the repository: pull requests from
# forks run with the read-only token like everyone else's, and the SonarCloud
# job's short-lived token comes from its own OIDC token, which a fork has not.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monday 06:00 Europe/Madrid in winter: OSV catches new advisories
    # against unchanged code.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "🧹 Lint (quality kit)"
    uses: kleidos-dev/.github/.github/workflows/reusable-lint.yml@f3cb9fc380dea5a33c4539f013c0b1dab8ca6b1d # quality-v2.3.0
    permissions:
      contents: read

  reuse:
    name: "⚖️ Licensing (REUSE)"
    uses: kleidos-dev/.github/.github/workflows/reusable-reuse.yml@f3cb9fc380dea5a33c4539f013c0b1dab8ca6b1d # quality-v2.3.0
    permissions:
      contents: read

  types:
    name: "🔎 Types (mypy)"
    needs: [lint, reuse]
    # The register's tool and its tests use the standard library only.
    uses: kleidos-dev/.github/.github/workflows/reusable-mypy.yml@f3cb9fc380dea5a33c4539f013c0b1dab8ca6b1d # quality-v2.3.0
    permissions:
      contents: read

  eslint:
    name: "🔎 ESLint and tsc"
    needs: [lint, reuse]
    uses: kleidos-dev/.github/.github/workflows/reusable-eslint.yml@f3cb9fc380dea5a33c4539f013c0b1dab8ca6b1d # quality-v2.3.0
    with:
      working-directory: worker
      projects: tsconfig.json ../scripts/tsconfig.json
      node-version: "26"
    permissions:
      contents: read

  register:
    name: "🐍 Register tests"
    needs: [lint, reuse]
    uses: kleidos-dev/.github/.github/workflows/reusable-python-tests.yml@f3cb9fc380dea5a33c4539f013c0b1dab8ca6b1d # quality-v2.3.0
    with:
      install: python -m pip install --require-hashes -r requirements.txt
      run: >-
        python -m coverage run -m unittest discover -s registry/tests -v
        && python -m coverage xml
      coverage-artifact: coverage-register
    permissions:
      contents: read

  osv:
    name: "🛡️ Dependency vulnerabilities (OSV)"
    needs: [lint, reuse]
    uses: kleidos-dev/.github/.github/workflows/reusable-osv.yml@f3cb9fc380dea5a33c4539f013c0b1dab8ca6b1d # quality-v2.3.0
    permissions:
      contents: read

  secrets:
    name: "🔐 Secrets and MAC scan (gitleaks)"
    needs: [lint, reuse]
    uses: kleidos-dev/.github/.github/workflows/reusable-secrets.yml@f3cb9fc380dea5a33c4539f013c0b1dab8ca6b1d # quality-v2.3.0
    permissions:
      contents: read

  worker:
    name: "🧪 Worker tests"
    needs: [lint, reuse]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: No floor raised and no measure lowered without a dated reason
        if: github.event_name == 'pull_request'
        run: |
          git fetch --quiet --depth=1 origin "$GITHUB_BASE_REF"
          python3 tests/tools/ratchet.py base FETCH_HEAD
      - working-directory: worker
        run: npm ci
      - name: Vitest in the Workers runtime, GitHub mocked
        working-directory: worker
        run: npm run test:coverage
      - name: Hand the coverage report to the SonarCloud job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-worker
          path: worker/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  # The setup scripts and the agreement gate at 100 % of their lines,
  # branches and functions, their conditions held to tests/floors/scripts.toml,
  # and the real text of record.yml and verify.yml run and evaluated.
  scripts:
    name: "🔑 Setup scripts and workflows"
    needs: [lint, reuse]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - working-directory: worker
        run: npm ci
      - name: The scripts' tests, every line, branch and function
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include='scripts/*.ts' --test-coverage-include='worker/scripts/*.mjs'
          --test-coverage-lines=100 --test-coverage-branches=100 --test-coverage-functions=100
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=scripts-lcov.info
          scripts/test/*.test.ts
      - name: The scripts' conditions (MC/DC) against their floors
        run: |
          node tests/tools/node/selftest.mjs
          node tests/tools/node/scripts-mcdc.mjs coverage/scripts-mcdc.json scripts/test/*.test.ts
          python3 tests/tools/ratchet.py check scripts --conditions coverage/scripts-mcdc.json
      - name: The workflows' run blocks and expressions
        run: node --test tests/workflows/*.test.mts
      - name: Hand the coverage report to the SonarCloud job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-scripts
          path: scripts-lcov.info
          if-no-files-found: error
          retention-days: 1

  # The mutants of the lines a pull request changes in the setup scripts and
  # the agreement gate (all of them run every Monday, mutation.yml): a
  # survivor that tests/exclusions/scripts.toml does not list fails.
  scripts-mutants:
    name: "🧬 Mutants of the changed scripts"
    needs: [lint, reuse]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - working-directory: worker
        run: npm ci
      - name: Every mutant of the changed lines, at most 60, two at a time
        run: |
          git fetch --quiet --depth=1 origin "$GITHUB_BASE_REF"
          node tests/tools/node/scripts-mut.mjs --out coverage/scripts-mutation.json --since FETCH_HEAD --max 60 --workers 2 --timeout 60
          node tests/tools/node/scripts-mut.mjs --listed coverage/scripts-mutation.json

  # The sign pages in chromium, behind a network fence (tests/pages/).
  pages:
    name: "🌐 Pages"
    needs: [lint, reuse]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - working-directory: worker
        run: npm ci
      - name: Chromium, the build playwright-core pins
        working-directory: worker
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Every page in every variant, and the sign-in round trip
        run: node --test tests/pages/pages.test.mts

  # The two reports in the one artifact the SonarCloud job reads.
  coverage:
    name: "📦 Coverage reports"
    needs: [register, worker, scripts]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          pattern: coverage-*
          retention-days: 1

  # Secretless: the job's GitHub OIDC token is exchanged for a SonarQube
  # Cloud token that lasts 30 minutes and can analyze this one project (no
  # SONAR_TOKEN secret exists); a pull request from a fork ends green with a
  # notice. Mandatory: a refused exchange, a scanner error or an analysis
  # the server refuses is a red job.
  sonarcloud:
    name: "📊 SonarCloud"
    needs: [coverage]
    if: github.event_name != 'schedule'
    uses: kleidos-dev/.github/.github/workflows/reusable-sonarcloud.yml@f3cb9fc380dea5a33c4539f013c0b1dab8ca6b1d # quality-v2.3.0
    permissions:
      contents: read
      id-token: write
