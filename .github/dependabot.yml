#
# Every manifest directory with its ecosystem, each update held a week
# (cooldown) so a compromised or yanked release has time to be noticed.
# The quality kit's workflow references are moved by its sync, never here;
# its tools (pre-commit hooks, PyPI pins) are bumped in kleidos-dev/.github.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "kleidos-dev/.github*"
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # `typescript` is TypeScript 6's API (npm:@typescript/typescript6),
      # the name typescript-eslint 8 imports: TypeScript 7.0 ships no API.
      # The compiler is TypeScript 7 under @typescript/native. Lift this
      # when typescript-eslint reads TypeScript 7's own API.
      - dependency-name: typescript
        versions: [">=7"]
  # The setup script's package.json declares no dependency today (it runs
  # on Node's own modules and the Worker's typescript): covered so that a
  # first one is watched from the day it lands.
  - package-ecosystem: npm
    directory: /scripts
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # requirements.txt: coverage.py, for the CI alone (the register's tool
  # runs on the standard library).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
