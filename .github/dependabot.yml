#
# Every manifest directory with its ecosystem, each update held a week
# (cooldown) so a compromised or yanked release has time to be noticed.
# The quality kit's workflows are called by its name, @v3, which its releases
# move; its hooks' rev and the other hook revisions are moved here, and its
# own tools (PyPI pins) are bumped in kleidos-dev/.github.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "kleidos-dev/.github*"
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # `typescript` is TypeScript 6's API (npm:@typescript/typescript6),
      # the name typescript-eslint 8 imports: TypeScript 7.0 ships no API.
      # The compiler is TypeScript 7 under @typescript/native. Lift this
      # when typescript-eslint reads TypeScript 7's own API.
      - dependency-name: typescript
        versions: [">=7"]
  # The setup script's package.json declares no dependency today (it runs
  # on Node's own modules and the Worker's typescript): covered so that a
  # first one is watched from the day it lands.
  - package-ecosystem: npm
    directory: /scripts
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # requirements.txt: coverage.py, for the CI alone (the register's tool
  # runs on the standard library).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The hook revisions of .pre-commit-config.yaml, the kit's and third parties'.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude:
        - "https://github.com/kleidos-dev/.github"
    ignore:
      # The kit's next major is taken by hand, with the fixes it asks for.
      - dependency-name: "https://github.com/kleidos-dev/.github"
        update-types: ["version-update:semver-major"]
      # crate-ci/typos also tags its sub-crates, which read as typos 5.x.
      - dependency-name: "https://github.com/crate-ci/typos"
        versions: [">= 2"]
    groups:
      hooks:
        patterns: ["*"]
