# SPDX-License-Identifier: MIT
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint 8 supports TypeScript below 6.1; lift this when it supports 7.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
