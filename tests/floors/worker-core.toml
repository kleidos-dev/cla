  "worker/src/assess.ts",
  "worker/src/authors.ts",
  "worker/src/bot.ts",
  "worker/src/env.ts",
  "worker/src/github.ts",
  "worker/src/keys.ts",
  "worker/src/log.ts",
  "worker/src/registry.ts",
  "worker/src/session.ts",
  "worker/src/util.ts",
]

[misses]
