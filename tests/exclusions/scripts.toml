[[entry]]
kind = "mutant"
file = "scripts/create-signin-app.ts"
function = "main"
text = "false"
on = "const gh: Gh = (args, input, keep = false) => run(s.gh, args, input, { keep });"
operator = "BooleanLiteral"
replacement = "true"
reason = "equivalent"
why = """The default serves the three calls that do not read gh's output: the environment's PUT, the policy's POST
and secret set. With it true, their output is read into a text nobody uses and printed nowhere, so the terminal,
the exit code and every call are the same; run() itself is tested both ways (create-signin-app.test.ts, "run
keeps the command's output only when asked")."""

[[entry]]
