[[entry]]
kind = "mutant"
file = "scripts/create-github-app.ts"
function = "exchange"
text = 'typeof c.id !== "number"'
on = 'if (typeof c.id !== "number" || !Number.isSafeInteger(c.id) || c.id <= 0) throw new Error("the conversion has no id");'
operator = "ConditionalExpression"
replacement = "false"
reason = "equivalent"
why = """Number.isSafeInteger is false for every value that is not a number, so the condition after it refuses all
that the typeof test does: the typeof test is there for the type checker, which takes no Number.isSafeInteger as
a guard of the type and needs it before `c.id <= 0`."""

