[[entry]]
kind = "mutant"
file = "scripts/create-github-app.ts"
function = "main"
text = '""'
on = 'const code = url.searchParams.get("code") ?? "";'
operator = "StringLiteral"
replacement = '"Stryker was here!"'
reason = "equivalent"
why = """The default stands for a redirect with no code, and only the pattern ^[A-Za-z0-9_-]{1,100}$ reads it: the
empty text and "Stryker was here!" both fail it (a space, an exclamation mark), so both end in the same refusal,
exit 3. The default must be some text that fails the pattern: null would be read as "null", which matches."""

