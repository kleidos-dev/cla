file = "worker/scripts/check-agreement.mjs"
function = "check"
text = '"utf8"'
on = 'const config = JSON.parse(readFileSync(join(root, "registry/config.json"), "utf8"));'
operator = "StringLiteral"
replacement = '""'
reason = "equivalent"
why = """With an empty encoding readFileSync returns the bytes, and JSON.parse reads a Buffer through its toString(),
which decodes UTF-8: the same text, the same object."""

