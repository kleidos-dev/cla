[[entry]]
kind = "mutant"
file = "scripts/create-github-app.ts"
function = "main"
text = "process.argv.slice(2)"
on = "main(settings(process.argv.slice(2), process.env)).then("
operator = "MethodExpression"
replacement = "process.argv"
reason = "equivalent"
why = """settings() only asks whether one argument is exactly --test. The two entries the slice drops are the
absolute paths of node and of the script, which cannot be --test, so the answer is the same with or without
them."""

