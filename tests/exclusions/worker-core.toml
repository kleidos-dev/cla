#
# The misses of the Worker's core that stay, each with one of the four reasons
# of the testing standard (unreachable, equivalent, boundary, tool) and why.
# tests/tools/ratchet.py fails on a miss that is not here, on an entry that is
# no longer missed and on one whose text is gone.

[[entry]]
kind = "mutant"
file = "worker/src/bot.ts"
function = "cron"
text = "at.slice(0, 10)"
on = "return age < COVERAGE_WINDOW_MS && age > COVERAGE_SETTLE_MS && at.slice(0, 10) >= coverageFrom;"
operator = "MethodExpression"
replacement = "at"
reason = "equivalent"
why = """registry/schema/config.schema.json takes a date alone as coverage_from, and the register's file is held to it: a time
is on or after a date exactly when the date it starts with is, and every time is after the empty text of none."""
