#
# The misses of the Worker's edge that stay, each with one of the four reasons
# of the testing standard (unreachable, equivalent, boundary, tool) and why.
# tests/tools/ratchet.py fails on a miss that is not here, on an entry that is
# no longer missed and on one whose text is gone.

[[entry]]
kind = "condition"
file = "worker/src/web.ts"
function = "agree"
text = "e instanceof GitHubError"
on = "e instanceof GitHubError && (e.kind === \"unauthorized\" || e.kind === \"forbidden\" || e.kind === \"not_found\")"
reason = "unreachable"
why = """The try holds one call, bot.gh.request with the session's token, and request() turns every failure into a GitHubError
(github.ts: a refused fetch, an unreadable body and bad JSON included); the token cannot make the header throw, since
the callback already sent it to GET /user. The test is the type guard that lets the catch read e.kind."""

