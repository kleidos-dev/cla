#
# The lines of the workflows' run blocks that can be deleted with every case
# of tests/workflows/ still passing, each with its reason. The tests fail on
# a line that survives and is not here, and on an entry that no longer
# survives or whose text is gone. `function` is the job and the step.

[[entry]]
kind = "mutant"
file = ".github/workflows/record.yml"
function = "record/Record"
text = "set -euo pipefail"
operator = "line deleted"
reason = "equivalent"
why = """Every check exits by itself (`|| { echo ...; exit 2; }`), the recorder's failure is caught by `|| rc=$?` and
passed on by `exit "$rc"`, no variable can be unset (GitHub sets each env: entry, an empty input as ""), and there
is no pipe: -e, -u and pipefail change nothing the step does."""

[[entry]]
kind = "mutant"
file = ".github/workflows/record.yml"
function = "signin/Record"
text = "set -euo pipefail"
operator = "line deleted"
reason = "equivalent"
why = """Every check exits by itself, the recorder is the last command so its exit code is the step's, no variable
can be unset (GitHub sets each env: entry) and there is no pipe: -e, -u and pipefail change nothing."""
